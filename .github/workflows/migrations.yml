name: Migrations

# Deliberately NOT gated with a top-level `paths:` filter. "Apply Migrations" is a
# required status check on main: a workflow that never triggers never reports, and a
# required check that never reports leaves the pull request pending forever rather than
# failing. A skipped job, by contrast, satisfies the check. So the workflow always runs
# and the cost gate moved to `if:` on the expensive job below.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Cheap: a checkout and a diff, no containers. Decides whether the Postgres job below
  # has anything to validate.
  detect:
    name: Detect SQL changes
    runs-on: ubuntu-latest
    outputs:
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          # Via env rather than inline ${{ }} so nothing from the event interpolates
          # into the shell.
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi

          # A branch's first push reports an all-zero "before", and a force-push can name
          # a commit that is no longer reachable. Neither is a diff we can take, so fall
          # back to running the gate rather than skipping it.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base commit ($base) — running the migration gate"
            echo "sql=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- \
            'supabase/**' '.github/workflows/migrations.yml')

          if [ -n "$changed" ]; then
            echo "changed:"; echo "$changed"
            echo "sql=true" >>"$GITHUB_OUTPUT"
          else
            echo "no supabase/** change — skipping the migration gate"
            echo "sql=false" >>"$GITHUB_OUTPUT"
          fi

  apply-migrations:
    name: Apply Migrations
    needs: detect
    # Skipped — not absent — when nothing SQL changed, so the required check still reports.
    if: needs.detect.outputs.sql == 'true'
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      # Pinned: the -x service names below are validated against this CLI release.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Only the database. Every other service is excluded — none of them are needed to
      # decide whether the SQL is valid, and each one is an image pull.
      - name: Start local Postgres
        run: supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,gotrue,storage-api

      # The actual gate: drops the database and replays migrations 001..N followed by the
      # seed files, exiting non-zero on the first SQL error.
      - name: Apply every migration and seed from scratch
        run: supabase db reset

      # cron.schedule() stores its command unparsed, so a broken job body survives the
      # step above. Run each one once.
      - name: Execute each scheduled cron job body
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/run_cron_jobs.sql
